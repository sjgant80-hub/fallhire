name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the number that decides whether somebody gets the job
        run: node scorecard.test.mjs

      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate scorecard.mjs \
            --cap 400 --baseline witness.scorecard.baseline.json --test "node scorecard.test.mjs"

      - name: the shipped page still matches the gated kernel
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from scorecard.mjs — run build-page.mjs and commit."; exit 1; }

      # ⚑ Coverage must keep travelling with the score. Checked locally before being written here, so
      # it cannot trip on a comment that merely describes the old code.
      - name: the score never travels without its coverage
        run: |
          grep -q 'SC.assess' index.html || { echo '::error::the scorecard maths is not coming from the kernel'; exit 1; }
          grep -q 'panelNote' index.html || { echo '::error::the card no longer says what the score rests on'; exit 1; }
          echo ok
